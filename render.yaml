services:
  - type: web
    name: wandermind
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WANDERMIND_ENV
        value: prod
      - key: WANDERMIND_DATABASE_URL
        fromDatabase:
          name: wandermind-db
          property: connectionString
      - key: WANDERMIND_CORS_ORIGINS
        value: '[]'
      - key: WANDERMIND_ACCESS_USERNAME
        value: wandermind
      - key: WANDERMIND_ACCESS_PASSWORD
        generateValue: true
      - key: WANDERMIND_RUNTIME_ADAPTER
        value: mock
      - key: WANDERMIND_AUTO_CREATE_SCHEMA
        value: "false"
      - key: WANDERMIND_ENABLE_SCHEDULER
        value: "true"

databases:
  - name: wandermind-db
    plan: free
    region: singapore
    databaseName: wandermind
    user: wandermind
    postgresMajorVersion: "16"
    ipAllowList: []
