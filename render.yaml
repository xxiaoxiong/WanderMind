services:
  - type: web
    name: wandermind
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WANDERMIND_ENV
        value: prod
      - key: WANDERMIND_DATABASE_URL
        fromDatabase:
          name: wandermind-db
          property: connectionString
      - key: WANDERMIND_CORS_ORIGINS
        value: '[]'
      - key: WANDERMIND_RUNTIME_ADAPTER
        value: openai
      - key: WANDERMIND_LLM_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: WANDERMIND_LLM_API_KEY
        sync: false
      - key: WANDERMIND_LLM_MODEL
        value: agnes-2.5-flash
      - key: WANDERMIND_LLM_TEMPERATURE
        value: "0.2"
      - key: WANDERMIND_LLM_MAX_OUTPUT_TOKENS
        value: "2000"
      - key: WANDERMIND_RUNTIME_MAX_RETRIES
        value: "1"
      - key: WANDERMIND_RUNTIME_TIMEOUT_SECONDS
        value: "45"
      - key: WANDERMIND_AUTO_CREATE_SCHEMA
        value: "false"
      - key: WANDERMIND_ENABLE_SCHEDULER
        value: "true"

databases:
  - name: wandermind-db
    plan: free
    region: singapore
    databaseName: wandermind
    user: wandermind
    postgresMajorVersion: "16"
    ipAllowList: []
