name: Keep WanderMind Active

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wandermind-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake service and verify autopilot
        env:
          AUTOPILOT_URL: https://wandermind-p6jg.onrender.com/api/v1/autopilot/status
        run: |
          response="$(curl --fail --show-error --silent \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$AUTOPILOT_URL")"
          echo "$response" | jq -e '.worker_running == true' >/dev/null
